<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Great Index</title> 
</head>
<body>
    <div class="container">
        <h1>The Great Index of Improbable Names</h1>
        
        <div class="generator-box">
            <h2 id="displayGeneratedName">Ready to Generate?</h2>
            
            <div class="button-group">      
                <button class="gen-btn" onclick="handleGenerateRequest(1)">Generate One</button>
                <button class="gen-btn" onclick="handleGenerateRequest(5)">Generate 5</button>
            </div>
        </div>

        <section class="results-section">
            <h3>Generated Results</h3>
            <ul id="displayGeneratedList" class="name-results"></ul>
        </section>

        <hr>

        <section class="saved-section">
            <h3>⭐ Saved Names</h3>
            <ul id="savedNamesList"></ul>
            <button class="gen-btn" onclick="clearSavedNames()"> Clear All Saved</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
